<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VAL Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(240, 217, 74, 0.16), transparent 28rem),
          linear-gradient(180deg, #111317, #252b33);
        font-family: Arial, sans-serif;
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border: 14px solid #111317;
        border-radius: 38px;
        background: #05070b;
        box-shadow:
          0 28px 72px rgba(0, 0, 0, 0.48),
          inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }

      .phone::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        z-index: 2;
        width: 118px;
        height: 18px;
        border-radius: 999px;
        transform: translateX(-50%);
        background: #111317;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <iframe id="preview" title="VAL mobile preview"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const src = params.get("src");
      const frame = document.getElementById("preview");

      if (src) {
        frame.src = src;
      }
    </script>
  </body>
</html>
