name: Database Backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Backup reason
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
      BACKUP_DIR: backups
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify backup tooling
        run: npm run backup:check-tools

      - name: Run database backup
        run: npm run backup:db -- --reason "${{ github.event.inputs.reason || 'daily' }}"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: val-database-backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 14
