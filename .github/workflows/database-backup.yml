name: Database Backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Backup reason
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
      BACKUP_DIR: backups
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify backup tooling
        run: npm run backup:check-tools

      - name: Run database backup
        run: npm run backup:db -- --reason "${{ github.event.inputs.reason || 'daily' }}"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: val-database-backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 14
